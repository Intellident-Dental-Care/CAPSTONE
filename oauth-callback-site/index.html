<!DOCTYPE html>
<html>
<head>
    <title>DentalCare Authentication</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #FFC0CB;
            color: #333;
        }
        .container {
            text-align: center;
            padding: 2.5rem;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(255, 105, 180, 0.3);
            border: 2px solid rgba(255, 105, 180, 0.2);
            backdrop-filter: blur(10px);
            max-width: 400px;
            margin: 20px;
        }
        .logo {
            width: 80px;
            height: 80px;
            background: #FFC0CB;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            box-shadow: 0 4px 15px rgba(255, 105, 180, 0.4);
        }
        .logo::before {
            content: "🦷";
            font-size: 2.5rem;
        }
        .status-icon { 
            font-size: 3.5rem; 
            margin-bottom: 1rem; 
            animation: bounce 0.8s ease-in-out infinite;
        }
        .message { 
            font-size: 1.5rem; 
            margin-bottom: 1.5rem; 
            font-weight: 700;
            color: #FFC0CB;
        }
        .subtitle {
            font-size: 1rem;
            margin-bottom: 1rem;
            color: #666;
            font-weight: 500;
        }
        .instruction { 
            background: rgba(255, 192, 203, 0.1);
            padding: 1rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 192, 203, 0.3);
            font-size: 0.95rem;
            color: #555;
            line-height: 1.4;
        }
        .instruction strong {
            color: #FFC0CB;
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-8px); }
            60% { transform: translateY(-4px); }
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 192, 203, 0.3);
            border-radius: 50%;
            border-top-color: #FFC0CB;
            animation: spin 1s ease-in-out infinite;
            margin-right: 8px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .close-timer {
            margin-top: 1rem;
            font-size: 0.85rem;
            color: #999;
        }
        .error {
            color: #ff4444;
        }
        .success {
            color: #44ff44;
        }
        .mobile-return {
            margin-top: 1rem;
            padding: 12px 24px;
            background: #FFC0CB;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo"></div>
        <div class="status-icon" id="statusIcon">⏳</div>
        <div class="message" id="statusMessage">Processing Authentication...</div>
        <div class="subtitle" id="statusSubtitle">Please wait while we verify your login</div>
        <div class="instruction" id="statusInstruction">
            <span class="loading"></span>
            Connecting to DentalCare servers and processing your Google account...
        </div>
        <button class="mobile-return" id="mobileReturn" style="display: none;" onclick="returnToApp()">
            Return to DentalCare App
        </button>
    </div>

    <script>
        console.log('=== DENTALCARE OAUTH CALLBACK WITH TOKEN FORWARDING ===');
        console.log('Current URL:', window.location.href);
        console.log('Hash:', window.location.hash);
        console.log('Search:', window.location.search);

        // 1. Get the Base App URL (exp://...)
        const urlParams = new URLSearchParams(window.location.search);
        const returnToParam = urlParams.get('return_to');
        const baseAppUrl = returnToParam ? decodeURIComponent(returnToParam) : 'exp://';
        
        console.log('📱 Base App URL:', baseAppUrl);

        // 2. IMPORTANT: Capture the Auth Tokens (Hash or Query)
        // Supabase sends tokens in the hash (#access_token=...) OR query (?code=...)
        const currentHash = window.location.hash; // e.g. #access_token=...
        const currentSearch = window.location.search; // e.g. ?code=...&return_to=...

        console.log('🔍 Current Hash:', currentHash);
        console.log('🔍 Current Search:', currentSearch);

        // 3. Construct the FINAL URL by appending tokens to the App URL
        // We filter out 'return_to' from the search params so we don't duplicate it
        const searchParams = new URLSearchParams(currentSearch);
        searchParams.delete('return_to'); 
        const cleanSearch = searchParams.toString();
        
        console.log('🧹 Clean Search (without return_to):', cleanSearch);
        
        // Build the final deep link
        let finalRedirectUrl = baseAppUrl;
        
        // Append query params (if any exist besides return_to)
        if (cleanSearch) {
            finalRedirectUrl += (finalRedirectUrl.includes('?') ? '&' : '?') + cleanSearch;
        }
        
        // Append the hash (Crucial for Supabase Implicit Flow)
        if (currentHash) {
            finalRedirectUrl += currentHash;
        }

        console.log('🎯 Final Redirect URL with tokens:', finalRedirectUrl);

        // DOM elements
        const statusIcon = document.getElementById('statusIcon');
        const statusMessage = document.getElementById('statusMessage');
        const statusSubtitle = document.getElementById('statusSubtitle');
        const statusInstruction = document.getElementById('statusInstruction');
        const mobileReturn = document.getElementById('mobileReturn');

        function showSuccess() {
            statusIcon.textContent = '✅';
            statusIcon.className = 'status-icon success';
            statusMessage.textContent = 'Authentication Successful!';
            statusSubtitle.textContent = 'Returning to DentalCare App';
            statusInstruction.innerHTML = '<strong>Success!</strong><br><br>Your Google authentication was completed successfully.<br><br>Redirecting you back to the app with your credentials...';
            
            mobileReturn.style.display = 'inline-block';
            mobileReturn.textContent = 'Return to App';
            
            // Store success indicators for debugging
            localStorage.setItem('dentalcare_oauth_success', 'true');
            localStorage.setItem('dentalcare_oauth_timestamp', Date.now().toString());
            localStorage.setItem('dentalcare_final_url', finalRedirectUrl);
            
            // Auto redirect after short delay
            setTimeout(attemptSafeRedirect, 1500);
        }

        function showWaiting() {
            statusIcon.textContent = '⏳';
            statusMessage.textContent = 'Waiting for Authentication...';
            statusSubtitle.textContent = 'Processing your Google login';
            statusInstruction.innerHTML = '<span class="loading"></span>Waiting for Google to complete your authentication...';
            
            // Keep checking for tokens
            setTimeout(checkForTokens, 2000);
        }

        function showError() {
            statusIcon.textContent = '❌';
            statusMessage.textContent = 'Authentication Issue';
            statusSubtitle.textContent = 'Please try again';
            statusInstruction.innerHTML = '<strong>No tokens found.</strong><br><br>Please return to the app and try logging in again.';
            
            mobileReturn.style.display = 'inline-block';
            mobileReturn.textContent = 'Return to App';
        }

        function attemptSafeRedirect() {
            console.log('📱 Attempting redirect with OAuth tokens...');
            console.log('🔗 Redirecting to:', finalRedirectUrl);
            
            try {
                // Redirect to the URL containing the tokens
                window.location.href = finalRedirectUrl;
                statusInstruction.innerHTML = '<strong>Redirecting...</strong><br><br>Taking you back to the DentalCare app with your authentication tokens.';
            } catch (e) {
                console.log('Redirect failed:', e.message);
                statusInstruction.innerHTML = '<strong>Click the button below</strong><br><br>Automatic redirect was blocked by the browser.';
            }
        }

        function returnToApp() {
            console.log('📱 Manual return with tokens requested');
            console.log('🔗 Manual redirect to:', finalRedirectUrl);
            
            localStorage.setItem('dentalcare_manual_return', 'true');
            
            try {
                window.location.href = finalRedirectUrl;
                statusInstruction.innerHTML = '<strong>Redirecting...</strong><br><br>Manual redirect in progress with authentication tokens...';
                mobileReturn.style.display = 'none';
            } catch (e) {
                console.log('Manual redirect failed:', e.message);
                statusInstruction.innerHTML = '<strong>Please switch back manually</strong><br><br>Your authentication was successful. Switch back to the DentalCare app.';
                mobileReturn.style.display = 'none';
            }
        }

        function checkForTokens() {
            const hasTokensInHash = currentHash && (currentHash.includes('access_token') || currentHash.includes('refresh_token'));
            const hasTokensInSearch = cleanSearch && (cleanSearch.includes('code=') || cleanSearch.includes('access_token'));
            
            console.log('🔍 Checking for tokens...');
            console.log('📝 Has tokens in hash:', hasTokensInHash);
            console.log('📝 Has tokens in search:', hasTokensInSearch);
            
            if (hasTokensInHash || hasTokensInSearch) {
                console.log('✅ OAuth tokens detected! Showing success...');
                showSuccess();
            } else {
                console.log('⚠️ No OAuth tokens found yet, continuing to wait...');
                showWaiting();
            }
        }

        // Global function for button click
        window.returnToApp = returnToApp;
        
        // Start checking for tokens immediately
        checkForTokens();
        
        // Also listen for URL changes (in case tokens arrive via redirect)
        window.addEventListener('hashchange', () => {
            console.log('🔄 Hash changed, rechecking for tokens...');
            location.reload(); // Reload to reprocess with new tokens
        });
    </script>
</body>
</html>
