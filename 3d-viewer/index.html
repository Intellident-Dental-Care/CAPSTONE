<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dental 3D Viewer - IntelliDent</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #f4f4f4; font-family: Arial, sans-serif; }
      #app { position: fixed; inset: 0; }
      #ui {
        position: fixed; top: 12px; left: 12px; z-index: 10;
        background: rgba(255,255,255,.94); border-radius: 12px; padding: 15px;
        box-shadow: 0 8px 20px rgba(0,0,0,.15); display: flex; flex-direction: column; gap: 12px; min-width: 280px;
      }
      .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
      button {
        border: 1px solid #ddd; background: #fff; border-radius: 8px; padding: 8px 12px; cursor: pointer; transition: 0.2s; font-size: 13px;
      }
      button:hover { background: #e0e7ff; border-color: #a5b4fc; }
      #status { font-size: 13px; font-weight: bold; color: #1d4ed8; margin-top: 5px; }
      .hint { font-size: 11px; color: #666; }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <div id="ui">
      <div class="row">
        <button id="btnOpen">Open</button>
        <button id="btnFlat">Open Wide (Flat)</button>
        <button id="btnClose">Close</button>
      </div>
      <div class="row">
        <button id="clearSel" style="width: 100%;">Clear Selection</button>
      </div>

      <div id="status">Loading model...</div>
      <div class="hint">Click a tooth to select. Drag to rotate.</div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.161.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.161.0/examples/jsm/"
        }
      }
    </script>

    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

      // --- Scene Setup ---
      const app = document.getElementById("app");
      const statusEl = document.getElementById("status");

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0xf4f4f4);

      const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.01, 100);
      camera.position.set(0, 0, 3.5);

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      
      // CRITICAL FOR PURE-CODE SPLITTING
      renderer.localClippingEnabled = true; 
      
      app.appendChild(renderer.domElement);

      scene.add(new THREE.HemisphereLight(0xffffff, 0xbcbcbc, 1.2));
      const keyLight = new THREE.DirectionalLight(0xffffff, 1.0);
      keyLight.position.set(0, 2, 4);
      scene.add(keyLight);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.minDistance = 1.5; 
      controls.maxDistance = 5.5; 
      controls.minAzimuthAngle = -Math.PI / 2.5; 
      controls.maxAzimuthAngle = Math.PI / 2.5;  
      controls.maxPolarAngle = Math.PI / 1.6;    

      // --- Logic Variables ---
      const toothMeshes = [];
      const activeOverlays = []; 

      // Jaw Animation Groups
      const lowerJawGroup = new THREE.Group();
      const upperJawGroup = new THREE.Group();
      scene.add(lowerJawGroup);
      scene.add(upperJawGroup);
      
      // Animation State Tracker
      let animState = 'closed';

      // --- Load Model ---
      const loader = new GLTFLoader();
      const MODEL_URL = "./model/3DTeethModel.glb";

      loader.load(MODEL_URL, (gltf) => {
        const root = gltf.scene;
        scene.add(root);

        const box = new THREE.Box3().setFromObject(root);
        const center = box.getCenter(new THREE.Vector3());
        root.position.sub(center);
        
        root.rotation.y = Math.PI; 

        // Temporary arrays to hold parts safely
        const partsToLower = [];
        const partsToUpper = [];

        root.traverse((obj) => {
          if (obj.isMesh) {
            const name = obj.name.toUpperCase().trim();
            
            const isUpperTooth = name.endsWith('_U') || name.includes('_U_');
            const isLowerTooth = name.endsWith('_L') || name.includes('_L_');
            const isUpperJaw = name.includes('UPPER');
            const isLowerJaw = name.includes('LOWER');

            if (isUpperTooth || isLowerTooth) {
              toothMeshes.push(obj);
            }

            if (isLowerJaw || isLowerTooth) {
              partsToLower.push(obj);
            } else if (isUpperJaw || isUpperTooth) {
              partsToUpper.push(obj);
            }
          }
        });

        // SAFE ATTACHMENT
        partsToLower.forEach(obj => lowerJawGroup.attach(obj));
        partsToUpper.forEach(obj => upperJawGroup.attach(obj));

        statusEl.textContent = `Ready. ${toothMeshes.length} teeth loaded.`;
      });

      // --- PURE CODE SELECTION LOGIC ---
      const raycaster = new THREE.Raycaster();
      const pointer = new THREE.Vector2();

      function clearSelection() {
        activeOverlays.forEach((overlay) => {
          if (overlay.parent) overlay.parent.remove(overlay);
          if (overlay.material) overlay.material.dispose();
        });
        activeOverlays.length = 0;
        statusEl.textContent = "Selection cleared.";
      }

      function highlightMesh(mesh, hitPoint) {
        const isRightSide = hitPoint.x > 0;
        
        const clipNormal = isRightSide ? new THREE.Vector3(1, 0, 0) : new THREE.Vector3(-1, 0, 0);
        
        const mat = new THREE.MeshStandardMaterial({
          color: 0x87CEFA, // Light Blue
          roughness: 0.4,
          metalness: 0.1,
          side: THREE.DoubleSide,
          clippingPlanes: [ new THREE.Plane(clipNormal, 0) ], 
          polygonOffset: true, 
          polygonOffsetFactor: -1,
          polygonOffsetUnits: -1
        });

        const overlay = new THREE.Mesh(mesh.geometry, mat);
        overlay.raycast = function() {}; 
        mesh.add(overlay); 
        activeOverlays.push(overlay);
      }

      function selectSingle(mesh, hitPoint) {
        clearSelection();
        highlightMesh(mesh, hitPoint);
        
        const side = hitPoint.x > 0 ? "(L)" : "(R)";
        statusEl.textContent = `Selected: ${mesh.name} ${side}`;
      }

      // Click Event
      renderer.domElement.addEventListener("pointerdown", (e) => {
        const rect = renderer.domElement.getBoundingClientRect();
        pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

        raycaster.setFromCamera(pointer, camera);
        
        const hits = raycaster.intersectObjects(toothMeshes, false);
        
        if (hits.length > 0) {
          const clickedMesh = hits[0].object;
          const hitPoint = hits[0].point; 
          
          selectSingle(clickedMesh, hitPoint);
        }
      });

      document.getElementById("clearSel").onclick = clearSelection;

      // --- Animation Logic ---
      document.getElementById("btnOpen").onclick = () => animState = 'open'; 
      document.getElementById("btnFlat").onclick = () => animState = 'flat'; 
      document.getElementById("btnClose").onclick = () => animState = 'closed';

      // --- Render Loop ---
      function animate() {
        requestAnimationFrame(animate);

        let targetUpperRotX = 0, targetUpperPosY = 0, targetUpperPosZ = 0;
        let targetLowerRotX = 0, targetLowerPosY = 0, targetLowerPosZ = 0;

        if (animState === 'open') {
          // Standard slight open
          targetUpperRotX = -0.18; targetUpperPosY = 0.25; targetUpperPosZ = 0;
          targetLowerRotX = 0.18; targetLowerPosY = -0.25; targetLowerPosZ = 0;
        } else if (animState === 'flat') {
          // Flattened Occlusal View (Reduced Y separation to bring them closer)
          targetUpperRotX = -Math.PI / 2; targetUpperPosY = 0.5; targetUpperPosZ = -0.5;
          targetLowerRotX = Math.PI / 2; targetLowerPosY = -0.5; targetLowerPosZ = -0.5;
        }

        // Lerp everything for smooth transitions
        upperJawGroup.rotation.x = THREE.MathUtils.lerp(upperJawGroup.rotation.x, targetUpperRotX, 0.08);
        upperJawGroup.position.y = THREE.MathUtils.lerp(upperJawGroup.position.y, targetUpperPosY, 0.08);
        upperJawGroup.position.z = THREE.MathUtils.lerp(upperJawGroup.position.z, targetUpperPosZ, 0.08);

        lowerJawGroup.rotation.x = THREE.MathUtils.lerp(lowerJawGroup.rotation.x, targetLowerRotX, 0.08);
        lowerJawGroup.position.y = THREE.MathUtils.lerp(lowerJawGroup.position.y, targetLowerPosY, 0.08);
        lowerJawGroup.position.z = THREE.MathUtils.lerp(lowerJawGroup.position.z, targetLowerPosZ, 0.08);

        controls.update();
        renderer.render(scene, camera);
      }
      animate();

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>
  </body>
</html>
